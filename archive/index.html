<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Session Archive · UC Merced Legislative Simulation</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@0;1&family=Atkinson+Hyperlegible&display=swap">
<style>
  body {
    background: #f9f7f1; color: #211d15;
    font-family: "Atkinson Hyperlegible", Arial, sans-serif;
    margin: 0; padding: 4rem 1.25rem; line-height: 1.6;
  }
  .sheet { max-width: 34rem; margin: 0 auto; text-align: center; }
  .rule { border-top: 3px double #17345a; margin: 1.4rem 0; }
  h1 { font-family: "EB Garamond", Georgia, serif; font-weight: 500; color: #17345a; font-size: 2.1rem; margin: 0.4rem 0 0.2rem; }
  .sub { font-family: "EB Garamond", Georgia, serif; font-style: italic; color: #6d675b; margin: 0 0 0.5rem; }
  ul { list-style: none; padding: 0; margin: 1.6rem 0; }
  li { margin: 0.6rem 0; }
  a.year {
    font-family: "EB Garamond", Georgia, serif; font-size: 1.5rem; color: #17345a;
    text-decoration: none; border-bottom: 2px solid #d4a821; padding-bottom: 1px;
  }
  a.year:hover { color: #8f7210; }
  .back { font-size: 0.88rem; }
  .back a { color: #6d675b; }
</style>
</head>
<body>
  <div class="sheet">
    <div class="rule"></div>
    <h1>Session Archive</h1>
    <p class="sub">Prior years of the UC Merced California Legislative Simulation,<br>preserved as they stood at the close of each session.</p>
    <div class="rule"></div>
    <ul>
      <!-- Add one line per retired session, newest first. -->
      <li><a class="year" href="2025/">2025 Session</a></li>
    </ul>
    <p class="back"><a href="/">← Return to the current session</a></p>
  </div>
</body>
</html>
