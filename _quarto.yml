project:
  type: website
  # Only these render onto the site. Listing them keeps repo documentation
  # (README.md, intake/*.md) from quietly becoming public pages — a stray
  # intake/schemas.html once shipped that way.
  render:
    - "*.qmd"
    - "bills-pages/"
    - "senator-pages/"
    - "lobby-pages/"
  # These run before every render and (re)generate the per-bill, per-senator,
  # and per-lobby pages from the data in files/ and the vote sheets.
  pre-render:
    - Rscript scripts/make_bill_pages.R
    - Rscript scripts/make_senator_pages.R
    - Rscript scripts/make_lobby_pages.R
  # Copied into the site verbatim. archive/ holds prior years' sites
  # (see archive/index.html) and must never be rendered or altered.
  resources:
    - "files/"
    - "archive/"

# NOTE: no project-wide freeze here, on purpose. The generated pages
# (bills-pages/, senator-pages/, lobby-pages/) each carry "freeze: auto" in
# their own front matter — they skip re-execution unless their baked-in data
# changed, which is what keeps builds fast. The top-level pages read live
# data (CSVs, Google Sheets) and must re-execute every build; a project-wide
# freeze would serve them stale whenever data changed but their source
# didn't.

website:
  # Browser-tab suffix; the navbar shows the letterhead lockup instead
  title: "UC Merced Legislative Simulation"
  # Ordered by how often students need each page day-to-day:
  # the work (Bills/Committees/Votes), then the people (Senators/Lobbyists),
  # then press, then reference (Districts map, the Playbook).
  navbar:
    title: "California State Senate"
    left:
      - text: Home
        href: index.qmd
      - text: Bills
        href: bills.qmd
      - text: Committees
        href: committees.qmd
      - text: Votes
        href: votes.qmd
      - text: Senators
        href: senators.qmd
      - text: Lobbyists
        href: lobby.qmd
      - text: News
        href: news.qmd
      - text: Stats
        href: stats.qmd
      - text: Districts
        href: map.qmd
      - text: Life of a Bill
        href: life-of-a-bill.qmd
      - text: Filing Cabinet
        href: forms.qmd
      - text: Playbook
        href: help.qmd
  page-footer:
    left: "UC Merced California Legislative Simulation"
    center: "The site updates automatically as bills, votes, letters, and news are filed."
    right: "[Session Archive](archive/)"

format:
  html:
    # cosmo is the Bootstrap base; styles/brand.scss holds all of our own
    # design tokens and rules (colors, typefaces, table styling).
    theme:
      - cosmo
      - styles/brand.scss
    # No "On this page" rail and no hover ¶/link icons on headings —
    # this site's headings are page furniture, not document sections
    # to navigate or deep-link.
    toc: false
    anchor-sections: false
